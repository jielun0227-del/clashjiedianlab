{{ define "main" }}<section class="page-intro shell"><p class="eyebrow">{{ .Section | upper }}</p><h1>{{ .Title }}</h1><p>{{ .Description }}</p></section><section class="section shell"><div class="post-grid post-grid-wide">{{ range .RegularPages }}<article class="post-card"><div class="post-meta"><span>{{ .Section | upper }}</span><time>{{ .Date.Format "2006.01.02" }}</time></div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Description | default (.Summary | plainify | truncate 120) }}</p><a class="read-more" href="{{ .RelPermalink }}">继续阅读 <span>↗</span></a></article>{{ end }}</div></section>{{ end }}
