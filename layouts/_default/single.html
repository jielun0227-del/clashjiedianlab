{{ define "main" }}<article class="article shell"><header class="article-header"><p class="eyebrow">{{ .Section | upper }} / FIELD NOTE</p><h1>{{ .Title }}</h1><div class="article-meta"><time>更新于 {{ .Lastmod.Format "2006 年 01 月 02 日" }}</time><span>·</span><span>{{ .ReadingTime }} 分钟阅读</span><span>·</span><span>作者：{{ site.Params.author }}</span></div>{{ with .Params.tested }}<div class="tested-note"><strong>测试说明</strong><span>{{ . }}</span></div>{{ end }}</header><div class="article-layout"><aside class="toc"><span class="eyebrow">ON THIS PAGE</span>{{ .TableOfContents }}</aside><div class="article-content">{{ .Content }}<div class="article-end"><span>END OF NOTE</span><a href="{{ "/" | relURL }}">返回首页 ↑</a></div></div></div></article>{{ end }}
